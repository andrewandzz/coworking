<main class="coworking-page min-h-dvh">
  <div class="coworking-content mx-auto">
    <header>
      <app-coworking-brand class="coworking-brand" />
      <div class="coworking-intro">
        <h1 class="font-extrabold">Знайди свій простір для роботи</h1>
        <p>Обирай місце на карті та бронюй у зручний час</p>
      </div>
    </header>

    <app-space-filters class="coworking-filters" [(filters)]="filters" />

    <section class="coworking-plan-card border bg-white" aria-labelledby="coworking-plan-title">
      <h2 class="coworking-plan-title font-bold" id="coworking-plan-title">План коворкінгу</h2>
      <div class="coworking-plan-content grid items-start">
        <app-floor-plan [spaces]="planSpaces()" (spaceSelected)="selectSpace($event)" />
        <app-floor-plan-legend [filtersActive]="filtersActive()" />
      </div>
    </section>
  </div>
</main>

@if (selectedSpace(); as space) {
  <app-space-details-dialog [space]="space" (bookingRequested)="startBooking($event)"
      (closed)="selectedSpace.set(null)" />
}

@if (scheduleContext(); as context) {
  <app-booking-schedule [space]="context.space" [initialMode]="context.mode" [occupiedSlots]="context.occupiedSlots"
      (continued)="enterContacts($event)" (closed)="scheduleContext.set(null)" />
}

@if (contactContext(); as context) {
  <app-contact-form [reservation]="context.reservation" (continued)="enterPayment($event)"
      (retryRequested)="scheduleContext.set(context.scheduleContext)" (closed)="contactContext.set(null)" />
}

@if (paymentContext(); as context) {
  <app-payment-step [space]="context.scheduleContext.space" [submission]="context.submission"
      (paid)="confirmBooking($event)" (retryRequested)="scheduleContext.set(context.scheduleContext)"
      (closed)="paymentContext.set(null)" />
}

@if (confirmation(); as result) {
  <app-booking-result [confirmation]="result" (closed)="confirmation.set(null)" />
}
